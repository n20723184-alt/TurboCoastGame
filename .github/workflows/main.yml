name: Build Turbo Coast APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'TurboCoastAndroid/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p TurboCoastAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Coast-APK
          path: TurboCoastAndroid/app/build/outputs/apk/debug/app-debug.apk
